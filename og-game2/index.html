<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main-content">
<div class="minimal-home">
    <div class="game-intro">
        <h1>🐍 Snake Game</h1>
        <p>Welcome to the peak gaming experience v2. This time I implemented some top-notch encryption. I'm so sure you can't exploit this challenge that i will send you the flag if you submit a score above <strong>999 points</strong>.</p>
    </div>

    <div class="main-buttons">
        <a href="/game" class="btn btn-primary btn-large">Play</a>
        <a href="/scoreboard" class="btn btn-secondary btn-large">Scoreboard</a>
    </div>

    <div class="game-instructions">
        <h3>Controls</h3>
        <div class="controls-info">
            <p><kbd>↑ ↓ ← →</kbd> or <kbd>W A S D</kbd> - Move snake</p>
        </div>
    </div>
</div>
    </main>
</body>
</html>
