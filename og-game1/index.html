<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="main-content">
<div class="minimal-home">
    <div class="game-intro">
        <h1>🐍 Snake Game</h1>
        <p>This is a Capture The Flag challenge. Your goal is to obtain the flag by achieving a score above <strong>1000 points</strong> and submitting it to the leaderboard.</p>
    </div>

    <div class="main-buttons">
        <a href="/game" class="btn btn-primary btn-large">Play</a>
        <a href="/scoreboard" class="btn btn-secondary btn-large">Scoreboard</a>
    </div>

    <div class="game-instructions">
        <h3>Controls</h3>
        <div class="controls-info">
            <p><kbd>↑ ↓ ← →</kbd> or <kbd>W A S D</kbd> - Move snake</p>
        </div>
    </div>
</div>
    </main>
</body>
</html>
